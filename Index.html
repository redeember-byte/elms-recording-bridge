<!doctype html>
<!--
  RecordingBridge.html — standalone helper page for ELMS's Spoken Test
  self-recording feature. This is NOT an Apps Script HtmlService file and
  must NOT be added to the Apps Script project or served through
  HtmlService.createTemplateFromFile — it needs to be hosted on its own,
  completely separate origin (GitHub Pages, Firebase Hosting, Netlify, or
  any other static host) so that a browser treats it as an ordinary
  top-level page rather than as part of the sandboxed iframe Google Apps
  Script wraps deployed web apps in.

  WHY THIS FILE EXISTS: Apps Script's serving infrastructure embeds every
  deployed web app inside an iframe that is never granted the "microphone"
  Permissions Policy. Because of that, calling
  navigator.mediaDevices.getUserMedia() directly inside the ELMS app page
  reliably fails — usually without ever showing the browser's normal
  "Allow microphone access?" prompt — even when the student would otherwise
  allow it. See this project's README.md ("New: Spoken Test" section) for
  the full explanation and the sources that confirm this is a known,
  general Apps Script limitation, not a bug in ELMS's own code.

  HOW IT'S USED: ELMS opens this page in a popup window (see
  openSpokenRecordingBridge_ in Scripts.html). Because this page is loaded
  as a normal top-level page on its own origin, it is NOT subject to that
  restriction, so getUserMedia here behaves exactly like it would on any
  other website — including showing the browser's native permission
  dialog the first time. Once the student finishes recording, this page
  sends the recorded audio back to the ELMS window that opened it via
  postMessage, then closes itself.

  SETUP: upload this single file to any static host and put its public
  URL into ELMS.config.RECORDING_BRIDGE_URL near the top of Scripts.html
  (or ask an administrator with access to the Apps Script project to do
  so). No other configuration, backend, or server code is needed — this
  file is fully self-contained and talks only to the ELMS window that
  opened it.

  UNVERIFIED DISCLOSURE: this page's postMessage handshake and
  MediaRecorder logic were exercised end-to-end with a local headless
  browser (Playwright) using a fake microphone, confirming the message
  flow and base64 handoff work mechanically. It has not been verified
  against a real browser microphone, a real user's permission decision, or
  a real deployed Apps Script instance from this environment, which has no
  live Google account or browser access — see README.md for the same
  disclosure style used for every other AI/audio feature in this project.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELMS Recording Bridge</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 20px; background: #f7f7fa; color: #222; }
  h3 { margin: 0 0 4px; font-size: 16px; }
  .muted { color: #666; font-size: 13px; margin-bottom: 16px; }
  button { font-size: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
  button.primary { background: #2f6feb; color: #fff; border-color: #2f6feb; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 10px; font-size: 13px; min-height: 18px; }
  #elapsed { font-family: monospace; font-size: 14px; margin-left: 4px; }
  audio { width: 100%; margin-top: 10px; display: none; }
  .error { color: #b3261e; }
  .ok { color: #1a7f37; }
</style>
</head>
<body>
  <h3 id="label">ELMS Spoken Test — Recording</h3>
  <div class="muted" id="subtitle">Connecting to ELMS…</div>
  <div>
    <button id="startBtn" class="primary" disabled>&#9679; Start Recording</button>
    <button id="stopBtn" style="display:none;">Stop</button>
    <span id="elapsed" style="display:none;">00:00</span>
  </div>
  <audio id="playback" controls></audio>
  <div>
    <button id="sendBtn" class="primary" style="display:none;">Use this recording</button>
    <button id="retryBtn" style="display:none;">Discard &amp; record again</button>
  </div>
  <div id="status"></div>

<script>
(function () {
  var openerOrigin = null;
  var mediaRecorder = null, chunks = [], stream = null, blob = null, mimeType = 'audio/webm';

  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');
  var sendBtn = document.getElementById('sendBtn');
  var retryBtn = document.getElementById('retryBtn');
  var elapsedEl = document.getElementById('elapsed');
  var statusEl = document.getElementById('status');
  var playback = document.getElementById('playback');
  var subtitle = document.getElementById('subtitle');
  var labelEl = document.getElementById('label');

  function setStatus(msg, cls) {
    statusEl.className = cls || '';
    statusEl.textContent = msg || '';
  }

  if (!window.opener) {
    setStatus('This window was not opened from ELMS, so there is nowhere to send a recording. You can close this window.', 'error');
  } else {
    // No sensitive data in this first message, so a wildcard target is fine —
    // it only ever reaches window.opener regardless of the target-origin
    // string; the string just restricts which origin is allowed to receive
    // it, and we don't yet know the opener's origin to restrict to.
    window.opener.postMessage({ type: 'elms-bridge-ready' }, '*');
  }

  window.addEventListener('message', function (evt) {
    if (evt.source !== window.opener) return;
    var data = evt.data || {};
    if (data.type === 'elms-bridge-init') {
      openerOrigin = evt.origin;
      if (data.label) labelEl.textContent = 'ELMS Spoken Test — ' + data.label;
      subtitle.textContent = 'Connected. Click "Start Recording," speak your answer, then click "Stop" when done.';
      startBtn.disabled = false;
    }
  });

  startBtn.addEventListener('click', function () {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setStatus('This browser does not support in-browser recording. Try a recent Chrome, Edge, or Firefox.', 'error');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      stream = s;
      chunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream);
      } catch (e) {
        setStatus('Could not start recording: ' + e.message, 'error');
        stream.getTracks().forEach(function (t) { t.stop(); });
        return;
      }
      mimeType = mediaRecorder.mimeType || 'audio/webm';
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      var seconds = 0;
      var tickId = setInterval(function () {
        seconds += 1;
        var m = Math.floor(seconds / 60), sec = seconds % 60;
        elapsedEl.textContent = (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
      }, 1000);
      mediaRecorder.onstop = function () {
        clearInterval(tickId);
        stream.getTracks().forEach(function (t) { t.stop(); });
        blob = new Blob(chunks, { type: mimeType });
        playback.src = URL.createObjectURL(blob);
        playback.style.display = 'block';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        elapsedEl.style.display = 'none';
        sendBtn.style.display = 'inline-block';
        retryBtn.style.display = 'inline-block';
        setStatus('Recording ready. Listen back, then click "Use this recording" to send it to ELMS, or discard and try again.', 'ok');
      };
      mediaRecorder.start();
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      elapsedEl.style.display = 'inline';
      setStatus('Recording…', 'ok');
    }).catch(function (err) {
      setStatus('Could not access the microphone: ' + err.message + '. Check this site\'s microphone permission in your browser settings and try again.', 'error');
    });
  });

  stopBtn.addEventListener('click', function () {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  });

  retryBtn.addEventListener('click', function () {
    blob = null;
    playback.style.display = 'none';
    sendBtn.style.display = 'none';
    retryBtn.style.display = 'none';
    startBtn.style.display = 'inline-block';
    setStatus('');
  });

  sendBtn.addEventListener('click', function () {
    if (!blob || !window.opener) return;
    sendBtn.disabled = true;
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = String(reader.result).split(',')[1] || '';
      window.opener.postMessage({ type: 'elms-bridge-recorded', base64: base64, mimeType: mimeType }, openerOrigin || '*');
      setStatus('Sent. You can close this window.', 'ok');
      setTimeout(function () { window.close(); }, 800);
    };
    reader.readAsDataURL(blob);
  });

  window.addEventListener('beforeunload', function () {
    if (window.opener) {
      try { window.opener.postMessage({ type: 'elms-bridge-cancelled' }, openerOrigin || '*'); } catch (e) { /* best-effort only */ }
    }
  });
})();
</script>
</body>
</html>
